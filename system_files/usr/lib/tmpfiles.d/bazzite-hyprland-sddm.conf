# Make the uwsm Hyprland session SDDM's preselected session. SDDM ignores a
# state file whose mtime is not after the epoch, so the file is written here
# (current mtime) rather than copied from the image (mtime 1970).
f /var/lib/sddm/state.conf 0644 sddm sddm - [Last]\nSession=/usr/share/wayland-sessions/hyprland-uwsm.desktop
