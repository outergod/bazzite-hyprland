# The default session is seeded into /var/lib/sddm/state.conf
# (tmpfiles.d/bazzite-hyprland-sddm.conf); SDDM has no config key for it.
# There is deliberately no [Autologin] section: a password is always required.

[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=weston --shell=kiosk

[Theme]
Current=sddm-astronaut-theme
